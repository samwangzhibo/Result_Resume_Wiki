<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5B8DD9"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.13"/></filter>
    <filter id="s2"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.09"/></filter>
    <linearGradient id="gTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A3060"/>
      <stop offset="100%" style="stop-color:#3A60A0"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="900" height="520" fill="#FAFBFD"/>
  
  <!-- 标题栏 -->
  <rect x="0" y="0" width="900" height="56" fill="url(#gTitle)"/>
  <text x="450" y="34" text-anchor="middle" fill="white" font-size="18" font-weight="bold">SDD 七阶段工作流：Spec-Driven Development</text>
  
  <!-- 阶段标签行 -->
  <g font-size="11" fill="#5A7AAA">
    <text x="130" y="82" text-anchor="middle">需求拆解</text>
    <text x="254" y="82" text-anchor="middle">需求实例化</text>
    <text x="378" y="82" text-anchor="middle">开发</text>
    <text x="502" y="82" text-anchor="middle">Debug</text>
    <text x="626" y="82" text-anchor="middle">测试准入</text>
    <text x="750" y="82" text-anchor="middle">线上Bug</text>
  </g>
  
  <!-- 阶段编号圆点 -->
  <g>
    <circle cx="130" cy="100" r="16" fill="#5B8DD9" filter="url(#s2)"/>
    <text x="130" y="105" text-anchor="middle" fill="white" font-size="12" font-weight="bold">1</text>
    
    <circle cx="254" cy="100" r="16" fill="#5B8DD9" filter="url(#s2)"/>
    <text x="254" y="105" text-anchor="middle" fill="white" font-size="12" font-weight="bold">2</text>
    
    <circle cx="378" cy="100" r="16" fill="#5B8DD9" filter="url(#s2)"/>
    <text x="378" y="105" text-anchor="middle" fill="white" font-size="12" font-weight="bold">3</text>
    
    <circle cx="502" cy="100" r="16" fill="#9B6DC8" filter="url(#s2)"/>
    <text x="502" y="105" text-anchor="middle" fill="white" font-size="12" font-weight="bold">4</text>
    
    <circle cx="626" cy="100" r="16" fill="#9B6DC8" filter="url(#s2)"/>
    <text x="626" y="105" text-anchor="middle" fill="white" font-size="12" font-weight="bold">5</text>
    
    <circle cx="750" cy="100" r="16" fill="#E08020" filter="url(#s2)"/>
    <text x="750" y="105" text-anchor="middle" fill="white" font-size="12" font-weight="bold">6</text>
  </g>
  
  <!-- 连接箭头 -->
  <g stroke="#5B8DD9" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="146" y1="100" x2="232" y2="100"/>
    <line x1="270" y1="100" x2="356" y2="100"/>
    <line x1="394" y1="100" x2="480" y2="100"/>
    <line x1="518" y1="100" x2="604" y2="100"/>
    <line x1="642" y1="100" x2="728" y2="100"/>
  </g>
  
  <!-- 核心产出区域 -->
  <g transform="translate(30, 130)">
    <rect x="0" y="0" width="840" height="180" rx="8" fill="#F5F8FF" stroke="#D0E0F0" stroke-width="1"/>
    <text x="20" y="28" font-size="13" font-weight="bold" fill="#2B5090">核心产出</text>
    
    <!-- 各阶段产出卡片 -->
    <g transform="translate(20, 45)">
      <!-- 阶段1 -->
      <rect x="0" y="0" width="110" height="115" rx="6" fill="white" stroke="#5B8DD9" stroke-width="1.5" filter="url(#s2)"/>
      <rect x="0" y="0" width="110" height="28" rx="6" fill="#5B8DD9"/>
      <rect x="0" y="14" width="110" height="14" fill="#5B8DD9"/>
      <text x="55" y="19" text-anchor="middle" fill="white" font-size="11" font-weight="bold">需求拆解</text>
      <text x="10" y="50" font-size="10" fill="#555">• 模块边界</text>
      <text x="10" y="68" font-size="10" fill="#555">• 关键依赖</text>
      <text x="10" y="86" font-size="10" fill="#555">• 风险点清单</text>
      <text x="10" y="104" font-size="10" fill="#3A9A3A" font-weight="bold">→ Spec 初稿</text>
      
      <!-- 阶段2 -->
      <rect x="124" y="0" width="110" height="115" rx="6" fill="white" stroke="#5B8DD9" stroke-width="1.5" filter="url(#s2)"/>
      <rect x="124" y="0" width="110" height="28" rx="6" fill="#5B8DD9"/>
      <rect x="124" y="14" width="110" height="14" fill="#5B8DD9"/>
      <text x="179" y="19" text-anchor="middle" fill="white" font-size="11" font-weight="bold">需求实例化</text>
      <text x="134" y="50" font-size="10" fill="#555">• 技术方案</text>
      <text x="134" y="68" font-size="10" fill="#555">• Mermaid图</text>
      <text x="134" y="86" font-size="10" fill="#555">• 多方案对比</text>
      <text x="134" y="104" font-size="10" fill="#3A9A3A" font-weight="bold">→ 详细 Spec</text>
      
      <!-- 阶段3 -->
      <rect x="248" y="0" width="110" height="115" rx="6" fill="white" stroke="#5B8DD9" stroke-width="1.5" filter="url(#s2)"/>
      <rect x="248" y="0" width="110" height="28" rx="6" fill="#5B8DD9"/>
      <rect x="248" y="14" width="110" height="14" fill="#5B8DD9"/>
      <text x="303" y="19" text-anchor="middle" fill="white" font-size="11" font-weight="bold">开发</text>
      <text x="258" y="50" font-size="10" fill="#555">• 分段编码</text>
      <text x="258" y="68" font-size="10" fill="#555">• TDD 验证</text>
      <text x="258" y="86" font-size="10" fill="#555">• 规则沉淀</text>
      <text x="258" y="104" font-size="10" fill="#3A9A3A" font-weight="bold">→ 可测试代码</text>
      
      <!-- 阶段4 -->
      <rect x="372" y="0" width="110" height="115" rx="6" fill="white" stroke="#9B6DC8" stroke-width="1.5" filter="url(#s2)"/>
      <rect x="372" y="0" width="110" height="28" rx="6" fill="#9B6DC8"/>
      <rect x="372" y="14" width="110" height="14" fill="#9B6DC8"/>
      <text x="427" y="19" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Debug</text>
      <text x="382" y="50" font-size="10" fill="#555">• 堆栈分析</text>
      <text x="382" y="68" font-size="10" fill="#555">• 日志定位</text>
      <text x="382" y="86" font-size="10" fill="#555">• 修复方案</text>
      <text x="382" y="104" font-size="10" fill="#3A9A3A" font-weight="bold">→ 修复记录</text>
      
      <!-- 阶段5 -->
      <rect x="496" y="0" width="110" height="115" rx="6" fill="white" stroke="#9B6DC8" stroke-width="1.5" filter="url(#s2)"/>
      <rect x="496" y="0" width="110" height="28" rx="6" fill="#9B6DC8"/>
      <rect x="496" y="14" width="110" height="14" fill="#9B6DC8"/>
      <text x="551" y="19" text-anchor="middle" fill="white" font-size="11" font-weight="bold">测试准入</text>
      <text x="506" y="50" font-size="10" fill="#555">• 影响范围</text>
      <text x="506" y="68" font-size="10" fill="#555">• AI Review</text>
      <text x="506" y="86" font-size="10" fill="#555">• Skill 更新</text>
      <text x="506" y="104" font-size="10" fill="#3A9A3A" font-weight="bold">→ CR 报告</text>
      
      <!-- 阶段6 -->
      <rect x="620" y="0" width="110" height="115" rx="6" fill="white" stroke="#E08020" stroke-width="1.5" filter="url(#s2)"/>
      <rect x="620" y="0" width="110" height="28" rx="6" fill="#E08020"/>
      <rect x="620" y="14" width="110" height="14" fill="#E08020"/>
      <text x="675" y="19" text-anchor="middle" fill="white" font-size="11" font-weight="bold">线上Bug</text>
      <text x="630" y="50" font-size="10" fill="#555">• 日志分析</text>
      <text x="630" y="68" font-size="10" fill="#555">• 根因定位</text>
      <text x="630" y="86" font-size="10" fill="#555">• 热修方案</text>
      <text x="630" y="104" font-size="10" fill="#3A9A3A" font-weight="bold">→ Oncall 记录</text>
      
      <!-- 阶段7 Oncall -->
      <rect x="744" y="0" width="96" height="115" rx="6" fill="white" stroke="#C03030" stroke-width="1.5" filter="url(#s2)"/>
      <rect x="744" y="0" width="96" height="28" rx="6" fill="#C03030"/>
      <rect x="744" y="14" width="96" height="14" fill="#C03030"/>
      <text x="792" y="19" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Oncall</text>
      <text x="754" y="50" font-size="10" fill="#555">• 假设排序</text>
      <text x="754" y="68" font-size="10" fill="#555">• 快速聚焦</text>
      <text x="754" y="86" font-size="10" fill="#555">• 召回决策</text>
      <text x="754" y="104" font-size="10" fill="#3A9A3A" font-weight="bold">→ 排查记录</text>
    </g>
  </g>
  
  <!-- 关键结论区域 -->
  <g transform="translate(30, 330)">
    <rect x="0" y="0" width="840" height="170" rx="8" fill="#FFF8E8" stroke="#E8D8C8" stroke-width="1"/>
    <text x="20" y="28" font-size="13" font-weight="bold" fill="#7A4000">关键结论</text>
    
    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="390" height="110" rx="6" fill="white" stroke="#E08020" stroke-width="1"/>
      <text x="15" y="28" font-size="12" font-weight="bold" fill="#E08020">前期 Spec 投入越充分，执行阶段返工越少</text>
      <text x="15" y="50" font-size="11" fill="#555">• 方案阶段改十遍 → 零成本</text>
      <text x="15" y="70" font-size="11" fill="#555">• 代码阶段结构固化 → 重构代价极高</text>
      <text x="15" y="90" font-size="11" fill="#555">• AI 在 Spec 阶段做"杠精反问"价值最高</text>
      
      <rect x="410" y="0" width="410" height="110" rx="6" fill="white" stroke="#3A9A3A" stroke-width="1"/>
      <text x="425" y="28" font-size="12" font-weight="bold" fill="#3A9A3A">AI 贡献度分布</text>
      <text x="425" y="50" font-size="11" fill="#555">• 🟢 高 ROI：需求实例化、Debug（有堆栈）、开发</text>
      <text x="425" y="70" font-size="11" fill="#555">• 🟡 中 ROI：测试准入、线上Bug</text>
      <text x="425" y="90" font-size="11" fill="#555">• 🔴 低 ROI：需求拆解、Oncall（信息残缺）</text>
    </g>
  </g>
</svg>
