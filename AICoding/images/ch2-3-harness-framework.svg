<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5B8DD9"/>
    </marker>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <linearGradient id="gTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A3060"/>
      <stop offset="100%" style="stop-color:#3A60A0"/>
    </linearGradient>
  </defs>
  <rect width="700" height="400" fill="#F7FAFF" rx="8"/>
  <rect x="0" y="0" width="700" height="46" fill="url(#gTitle)" rx="8"/>
  <rect x="0" y="34" width="700" height="12" fill="url(#gTitle)"/>
  <text x="350" y="28" text-anchor="middle" fill="white" font-size="15" font-weight="bold">Harness Engineering：为 AI 打造"工作室"</text>

  <!-- 类比说明 -->
  <rect x="30" y="58" width="640" height="32" rx="6" fill="#FFF8E8" stroke="#E08020" stroke-width="1.5"/>
  <text x="350" y="79" text-anchor="middle" fill="#7A4000" font-size="12">"Harness" = 马具：不是让马更聪明，而是为马打造一套控制、引导、约束它的工具体系</text>

  <!-- 三层架构 -->
  <!-- 知识层 -->
  <rect x="30" y="102" width="640" height="80" rx="8" fill="#E8F2FF" stroke="#5B8DD9" stroke-width="2" filter="url(#s)"/>
  <rect x="30" y="102" width="640" height="30" rx="8" fill="#5B8DD9"/>
  <rect x="30" y="120" width="640" height="12" fill="#5B8DD9"/>
  <text x="110" y="122" text-anchor="middle" fill="white" font-size="13" font-weight="bold">知识层</text>
  <text x="370" y="122" text-anchor="middle" fill="white" font-size="11">解决：AI 对项目一无所知</text>
  <text x="100" y="150" fill="#2B5090" font-size="11" font-weight="bold">核心实践：</text>
  <text x="190" y="150" fill="#5A7AAA" font-size="11">AGENTS.md · 架构文档 · 业务 Spec · 模块级文档</text>
  <text x="100" y="168" fill="#2B5090" font-size="11" font-weight="bold">效果：</text>
  <text x="148" y="168" fill="#5A7AAA" font-size="11">沉淀一次，AI 每次可读取；效果呈复利增长</text>

  <!-- 箭头 -->
  <line x1="350" y1="182" x2="350" y2="198" stroke="#5B8DD9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 约束层 -->
  <rect x="30" y="200" width="640" height="80" rx="8" fill="#F0E8FC" stroke="#9B6DC8" stroke-width="2" filter="url(#s)"/>
  <rect x="30" y="200" width="640" height="30" rx="8" fill="#9B6DC8"/>
  <rect x="30" y="218" width="640" height="12" fill="#9B6DC8"/>
  <text x="110" y="220" text-anchor="middle" fill="white" font-size="13" font-weight="bold">约束层</text>
  <text x="370" y="220" text-anchor="middle" fill="white" font-size="11">解决：AI 绕过架构边界，悄然劣化系统</text>
  <text x="100" y="248" fill="#4A2070" font-size="11" font-weight="bold">核心实践：</text>
  <text x="190" y="248" fill="#7A4AAA" font-size="11">自定义 Linter · constitution.md · 结构测试 · 类型系统</text>
  <text x="100" y="266" fill="#4A2070" font-size="11" font-weight="bold">效果：</text>
  <text x="148" y="266" fill="#7A4AAA" font-size="11">约束从"人口头提醒"变成"机械可验证"的物理定律</text>

  <!-- 箭头 -->
  <line x1="350" y1="280" x2="350" y2="296" stroke="#5B8DD9" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 反馈层 -->
  <rect x="30" y="298" width="640" height="80" rx="8" fill="#E8F8E8" stroke="#3A9A3A" stroke-width="2" filter="url(#s)"/>
  <rect x="30" y="298" width="640" height="30" rx="8" fill="#3A9A3A"/>
  <rect x="30" y="316" width="640" height="12" fill="#3A9A3A"/>
  <text x="110" y="318" text-anchor="middle" fill="white" font-size="13" font-weight="bold">反馈层</text>
  <text x="370" y="318" text-anchor="middle" fill="white" font-size="11">解决：AI 的输出无法自动验证</text>
  <text x="100" y="346" fill="#1A5A1A" font-size="11" font-weight="bold">核心实践：</text>
  <text x="190" y="346" fill="#5A9A5A" font-size="11">CI/CD · 自动化测试 · 日志监控 · TDD</text>
  <text x="100" y="364" fill="#1A5A1A" font-size="11" font-weight="bold">效果：</text>
  <text x="148" y="364" fill="#5A9A5A" font-size="11">AI 写代码，测试来验收——形成持续的对错反馈</text>

  <!-- 底部逻辑说明 -->
  <text x="350" y="394" text-anchor="middle" fill="#8899AA" font-size="10">逻辑：让 AI 读懂系统（知识层）→ 划定行动边界（约束层）→ 给持续反馈（反馈层）</text>
</svg>
