<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.10"/></filter>
    <linearGradient id="gTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A3060"/>
      <stop offset="100%" style="stop-color:#3A60A0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="330" fill="#F7FAFF" rx="8"/>
  <rect x="0" y="0" width="720" height="44" fill="url(#gTitle)" rx="8"/>
  <rect x="0" y="32" width="720" height="12" fill="url(#gTitle)"/>
  <text x="360" y="26" text-anchor="middle" fill="white" font-size="14" font-weight="bold">三种范式选型：Vibe Coding vs SDD vs TDD</text>

  <!-- Vibe Coding -->
  <rect x="20" y="56" width="210" height="246" rx="10" fill="white" stroke="#5B8DD9" stroke-width="1.5" filter="url(#s)"/>
  <rect x="20" y="56" width="210" height="36" rx="10" fill="#5B8DD9"/>
  <rect x="20" y="80" width="210" height="12" fill="#5B8DD9"/>
  <text x="125" y="80" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Vibe Coding</text>
  <text x="125" y="112" text-anchor="middle" fill="#2B5090" font-size="11" font-weight="bold">定义</text>
  <text x="125" y="128" text-anchor="middle" fill="#5A7AAA" font-size="10">自然语言描述"想要什么"</text>
  <text x="125" y="144" text-anchor="middle" fill="#5A7AAA" font-size="10">Agent 直接生成和迭代代码</text>
  <text x="125" y="172" text-anchor="middle" fill="#2B5090" font-size="11" font-weight="bold">适合</text>
  <text x="125" y="188" text-anchor="middle" fill="#5A7AAA" font-size="10">原型探索、个人项目</text>
  <text x="125" y="204" text-anchor="middle" fill="#5A7AAA" font-size="10">快速验证想法</text>
  <text x="125" y="228" text-anchor="middle" fill="#C03030" font-size="11" font-weight="bold">风险</text>
  <text x="125" y="244" text-anchor="middle" fill="#CC6060" font-size="10">缺少规范和测试</text>
  <text x="125" y="260" text-anchor="middle" fill="#CC6060" font-size="10">维护成本极高</text>
  <rect x="36" y="278" width="178" height="18" rx="6" fill="#E8F2FF"/>
  <text x="125" y="290" text-anchor="middle" fill="#2B5090" font-size="10" font-weight="bold">用于探索阶段</text>

  <!-- SDD -->
  <rect x="255" y="56" width="210" height="246" rx="10" fill="white" stroke="#9B6DC8" stroke-width="1.5" filter="url(#s)"/>
  <rect x="255" y="56" width="210" height="36" rx="10" fill="#9B6DC8"/>
  <rect x="255" y="80" width="210" height="12" fill="#9B6DC8"/>
  <text x="360" y="80" text-anchor="middle" fill="white" font-size="13" font-weight="bold">SDD（规格驱动）</text>
  <text x="360" y="112" text-anchor="middle" fill="#4A2070" font-size="11" font-weight="bold">定义</text>
  <text x="360" y="128" text-anchor="middle" fill="#7A4AAA" font-size="10">先写 Spec 再写代码</text>
  <text x="360" y="144" text-anchor="middle" fill="#7A4AAA" font-size="10">结构化文档为单一事实源</text>
  <text x="360" y="172" text-anchor="middle" fill="#4A2070" font-size="11" font-weight="bold">适合</text>
  <text x="360" y="188" text-anchor="middle" fill="#7A4AAA" font-size="10">生产环境、团队协作</text>
  <text x="360" y="204" text-anchor="middle" fill="#7A4AAA" font-size="10">合规要求高的项目</text>
  <text x="360" y="228" text-anchor="middle" fill="#E08020" font-size="11" font-weight="bold">风险</text>
  <text x="360" y="244" text-anchor="middle" fill="#AA6020" font-size="10">前期投入大</text>
  <text x="360" y="260" text-anchor="middle" fill="#AA6020" font-size="10">流程相对严格</text>
  <rect x="271" y="278" width="178" height="18" rx="6" fill="#F0E8FC"/>
  <text x="360" y="290" text-anchor="middle" fill="#4A2070" font-size="10" font-weight="bold">用于规划阶段</text>

  <!-- TDD -->
  <rect x="490" y="56" width="210" height="246" rx="10" fill="white" stroke="#3A9A3A" stroke-width="1.5" filter="url(#s)"/>
  <rect x="490" y="56" width="210" height="36" rx="10" fill="#3A9A3A"/>
  <rect x="490" y="80" width="210" height="12" fill="#3A9A3A"/>
  <text x="595" y="80" text-anchor="middle" fill="white" font-size="13" font-weight="bold">TDD（测试驱动）</text>
  <text x="595" y="112" text-anchor="middle" fill="#1A5A1A" font-size="11" font-weight="bold">定义</text>
  <text x="595" y="128" text-anchor="middle" fill="#5A9A5A" font-size="10">先写测试再写实现</text>
  <text x="595" y="144" text-anchor="middle" fill="#5A9A5A" font-size="10">Red-Green-Refactor 循环</text>
  <text x="595" y="172" text-anchor="middle" fill="#1A5A1A" font-size="11" font-weight="bold">适合</text>
  <text x="595" y="188" text-anchor="middle" fill="#5A9A5A" font-size="10">核心业务逻辑</text>
  <text x="595" y="204" text-anchor="middle" fill="#5A9A5A" font-size="10">高可靠性要求的模块</text>
  <text x="595" y="228" text-anchor="middle" fill="#E08020" font-size="11" font-weight="bold">风险</text>
  <text x="595" y="244" text-anchor="middle" fill="#AA6020" font-size="10">需要测试设计能力</text>
  <text x="595" y="260" text-anchor="middle" fill="#AA6020" font-size="10">遗留代码套用成本高</text>
  <rect x="506" y="278" width="178" height="18" rx="6" fill="#E8F8E8"/>
  <text x="595" y="290" text-anchor="middle" fill="#1A5A1A" font-size="10" font-weight="bold">用于质量保证阶段</text>

  <!-- 底部组合说明 -->
  <rect x="20" y="312" width="680" height="14" rx="4" fill="#2D3E56"/>
  <text x="360" y="322" text-anchor="middle" fill="white" font-size="10" font-weight="bold">三者非互斥，实践中组合使用：Vibe Coding（探索）→ SDD（规划）→ TDD（质量保证）</text>
</svg>
