<svg xmlns="http://www.w3.org/2000/svg" width="860" height="460" viewBox="0 0 860 460" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.10"/></filter>
    <linearGradient id="gTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A3060"/>
      <stop offset="100%" style="stop-color:#3A60A0"/>
    </linearGradient>
  </defs>
  <rect width="860" height="460" fill="#F7FAFF" rx="8"/>
  <rect x="0" y="0" width="860" height="44" fill="url(#gTitle)" rx="8"/>
  <rect x="0" y="32" width="860" height="12" fill="url(#gTitle)"/>
  <text x="430" y="26" text-anchor="middle" fill="white" font-size="14" font-weight="bold">各阶段 AI 工作流优化计划</text>

  <!-- 表头 -->
  <rect x="20" y="52" width="820" height="26" rx="0" fill="#E8F2FF"/>
  <text x="95" y="68" text-anchor="middle" fill="#2B5090" font-size="11" font-weight="bold">阶段</text>
  <text x="240" y="68" text-anchor="middle" fill="#2B5090" font-size="11" font-weight="bold">当前痛点</text>
  <text x="530" y="68" text-anchor="middle" fill="#2B5090" font-size="11" font-weight="bold">优化思路</text>
  <text x="770" y="68" text-anchor="middle" fill="#2B5090" font-size="11" font-weight="bold">优先级</text>

  <!-- 分割线 -->
  <line x1="155" y1="52" x2="155" y2="452" stroke="#CCDDEE" stroke-width="1"/>
  <line x1="340" y1="52" x2="340" y2="452" stroke="#CCDDEE" stroke-width="1"/>
  <line x1="735" y1="52" x2="735" y2="452" stroke="#CCDDEE" stroke-width="1"/>
  <rect x="20" y="52" width="820" height="400" rx="0" fill="none" stroke="#CCDDEE" stroke-width="1"/>

  <!-- 行1 -->
  <rect x="20" y="78" width="820" height="50" fill="#FAFAFE"/>
  <text x="95" y="98" text-anchor="middle" fill="#4A5A70" font-size="11">需求设计</text>
  <text x="95" y="116" text-anchor="middle" fill="#8899AA" font-size="9">（Spec 补全）</text>
  <text x="240" y="104" text-anchor="middle" fill="#C06060" font-size="10">业务正交维度散落在历史代码中</text>
  <text x="240" y="120" text-anchor="middle" fill="#C06060" font-size="10">AI 缺乏业务语义，拆解总偏差</text>
  <text x="530" y="104" text-anchor="middle" fill="#5A7AAA" font-size="10">构建业务 Spec 文档，将正交维度显式化</text>
  <text x="530" y="120" text-anchor="middle" fill="#5A7AAA" font-size="10">新需求开始前让 AI 做冲突扫描</text>
  <rect x="748" y="86" width="70" height="20" rx="4" fill="#FFF0F0" stroke="#C03030" stroke-width="1"/>
  <text x="783" y="100" text-anchor="middle" fill="#C03030" font-size="10" font-weight="bold">高</text>

  <!-- 行2 -->
  <rect x="20" y="128" width="820" height="50" fill="white"/>
  <text x="95" y="148" text-anchor="middle" fill="#4A5A70" font-size="11">需求实例化</text>
  <text x="95" y="166" text-anchor="middle" fill="#8899AA" font-size="9">（方案生成）</text>
  <text x="240" y="154" text-anchor="middle" fill="#C06060" font-size="10">对标已有实现时，AI 找不全相关代码</text>
  <text x="240" y="170" text-anchor="middle" fill="#C06060" font-size="10">改动点覆盖率低（约 60%）</text>
  <text x="530" y="154" text-anchor="middle" fill="#5A7AAA" font-size="10">建设模块级 Spec 文档（礼物 / 连线 / 成组送等）</text>
  <text x="530" y="170" text-anchor="middle" fill="#5A7AAA" font-size="10">参考内部实践：改动点覆盖率提升到 95%</text>
  <rect x="748" y="136" width="70" height="20" rx="4" fill="#FFF0F0" stroke="#C03030" stroke-width="1"/>
  <text x="783" y="150" text-anchor="middle" fill="#C03030" font-size="10" font-weight="bold">高</text>

  <!-- 行3 -->
  <rect x="20" y="178" width="820" height="50" fill="#FAFAFE"/>
  <text x="95" y="198" text-anchor="middle" fill="#4A5A70" font-size="11">代码开发</text>
  <text x="95" y="216" text-anchor="middle" fill="#8899AA" font-size="9">（偷懒 + 上下文）</text>
  <text x="240" y="204" text-anchor="middle" fill="#C06060" font-size="10">长对话中 AI 跳过细节、忘记早期约束</text>
  <text x="530" y="200" text-anchor="middle" fill="#5A7AAA" font-size="10">分段编码 + 逐步验证；关键约束固化到 AGENTS.md</text>
  <text x="530" y="216" text-anchor="middle" fill="#5A7AAA" font-size="10">对话超长时主动新开对话并重新注入核心上下文</text>
  <rect x="748" y="186" width="70" height="20" rx="4" fill="#FFF8E8" stroke="#E08020" stroke-width="1"/>
  <text x="783" y="200" text-anchor="middle" fill="#7A4000" font-size="10" font-weight="bold">中</text>

  <!-- 行4 -->
  <rect x="20" y="228" width="820" height="50" fill="white"/>
  <text x="95" y="248" text-anchor="middle" fill="#4A5A70" font-size="11">自测</text>
  <text x="240" y="254" text-anchor="middle" fill="#C06060" font-size="10">自测用例覆盖率依赖个人经验</text>
  <text x="530" y="250" text-anchor="middle" fill="#5A7AAA" font-size="10">让 AI 基于需求文档 + 代码改动自动生成</text>
  <text x="530" y="266" text-anchor="middle" fill="#5A7AAA" font-size="10">测试用例矩阵（场景 × 预期 × 边界）</text>
  <rect x="748" y="236" width="70" height="20" rx="4" fill="#FFF8E8" stroke="#E08020" stroke-width="1"/>
  <text x="783" y="250" text-anchor="middle" fill="#7A4000" font-size="10" font-weight="bold">中</text>

  <!-- 行5 -->
  <rect x="20" y="278" width="820" height="50" fill="#FAFAFE"/>
  <text x="95" y="298" text-anchor="middle" fill="#4A5A70" font-size="11">测试</text>
  <text x="95" y="316" text-anchor="middle" fill="#8899AA" font-size="9">（用例维护）</text>
  <text x="240" y="304" text-anchor="middle" fill="#C06060" font-size="10">测试用例随代码变化而过时，维护成本高</text>
  <text x="530" y="300" text-anchor="middle" fill="#5A7AAA" font-size="10">AI 在代码变更时自动同步更新测试用例</text>
  <text x="530" y="316" text-anchor="middle" fill="#5A7AAA" font-size="10">保持测试与实现的持续对齐</text>
  <rect x="748" y="286" width="70" height="20" rx="4" fill="#E8F8E8" stroke="#3A9A3A" stroke-width="1"/>
  <text x="783" y="300" text-anchor="middle" fill="#1A5A1A" font-size="10" font-weight="bold">低</text>

  <!-- 行6 -->
  <rect x="20" y="328" width="820" height="50" fill="white"/>
  <text x="95" y="348" text-anchor="middle" fill="#4A5A70" font-size="11">灰度上线</text>
  <text x="240" y="354" text-anchor="middle" fill="#C06060" font-size="10">灰度异常时，从日志到根因路径依赖人工</text>
  <text x="530" y="350" text-anchor="middle" fill="#5A7AAA" font-size="10">预埋关键链路日志 + AI 过滤分析</text>
  <text x="530" y="366" text-anchor="middle" fill="#5A7AAA" font-size="10">建设 Oncall Skill：记录常见异常模式和排查路径</text>
  <rect x="748" y="336" width="70" height="20" rx="4" fill="#FFF8E8" stroke="#E08020" stroke-width="1"/>
  <text x="783" y="350" text-anchor="middle" fill="#7A4000" font-size="10" font-weight="bold">中</text>

  <!-- 行7 -->
  <rect x="20" y="378" width="820" height="50" fill="#FAFAFE"/>
  <text x="95" y="398" text-anchor="middle" fill="#4A5A70" font-size="11">全量上线</text>
  <text x="240" y="404" text-anchor="middle" fill="#C06060" font-size="10">全量上线前风险评估缺乏系统化方法</text>
  <text x="530" y="400" text-anchor="middle" fill="#5A7AAA" font-size="10">AI 对比版本 diff + 历史 Oncall 记录</text>
  <text x="530" y="416" text-anchor="middle" fill="#5A7AAA" font-size="10">生成"高风险改动"清单，辅助上线决策</text>
  <rect x="748" y="386" width="70" height="20" rx="4" fill="#E8F8E8" stroke="#3A9A3A" stroke-width="1"/>
  <text x="783" y="400" text-anchor="middle" fill="#1A5A1A" font-size="10" font-weight="bold">低</text>
</svg>
