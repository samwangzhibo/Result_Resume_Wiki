<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.10"/></filter>
    <linearGradient id="gTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A3060"/>
      <stop offset="100%" style="stop-color:#3A60A0"/>
    </linearGradient>
  </defs>
  <rect width="820" height="300" fill="#F7FAFF" rx="8"/>
  <rect x="0" y="0" width="820" height="44" fill="url(#gTitle)" rx="8"/>
  <rect x="0" y="32" width="820" height="12" fill="url(#gTitle)"/>
  <text x="410" y="26" text-anchor="middle" fill="white" font-size="15" font-weight="bold">两个习惯养成</text>

  <!-- 习惯1 -->
  <rect x="20" y="56" width="380" height="228" rx="10" fill="#E8F8E8" stroke="#3A9A3A" stroke-width="1.5" filter="url(#s)"/>
  <rect x="20" y="56" width="380" height="34" rx="10" fill="#3A9A3A"/>
  <rect x="20" y="78" width="380" height="12" fill="#3A9A3A"/>
  <text x="210" y="79" text-anchor="middle" fill="white" font-size="13" font-weight="bold">习惯一：每次 AI 出错后写一条规则</text>

  <text x="36" y="110" fill="#1A5A1A" font-size="11" font-weight="bold">触发条件</text>
  <text x="36" y="128" fill="#5A9A5A" font-size="10">AI 输出了不符合规范的代码或建议</text>

  <text x="36" y="152" fill="#1A5A1A" font-size="11" font-weight="bold">操作</text>
  <text x="36" y="170" fill="#5A9A5A" font-size="10">① 纠正 AI → ② 花 3 分钟把规则写进 AGENTS.md 或 Skill</text>
  <text x="36" y="188" fill="#5A9A5A" font-size="10">格式：「在XXX情况下，要/不要XXX，原因是XXX」</text>

  <text x="36" y="212" fill="#1A5A1A" font-size="11" font-weight="bold">复利效应</text>
  <text x="36" y="228" fill="#5A9A5A" font-size="10">第 1 个月：规则约 20 条，偶尔翻看</text>
  <text x="36" y="244" fill="#5A9A5A" font-size="10">第 6 个月：规则约 100 条，AI 几乎不再犯同类错误</text>
  <text x="36" y="260" fill="#5A9A5A" font-size="10">第 1 年：一份完整的团队工程规范自动形成</text>

  <!-- 习惯2 -->
  <rect x="420" y="56" width="380" height="228" rx="10" fill="#E8F2FF" stroke="#5B8DD9" stroke-width="1.5" filter="url(#s)"/>
  <rect x="420" y="56" width="380" height="34" rx="10" fill="#5B8DD9"/>
  <rect x="420" y="78" width="380" height="12" fill="#5B8DD9"/>
  <text x="610" y="79" text-anchor="middle" fill="white" font-size="13" font-weight="bold">习惯二：写代码前先出方案结构</text>

  <text x="436" y="110" fill="#2B5090" font-size="11" font-weight="bold">触发条件</text>
  <text x="436" y="128" fill="#5A7AAA" font-size="10">任何超过 30 分钟工作量的开发任务</text>

  <text x="436" y="152" fill="#2B5090" font-size="11" font-weight="bold">操作</text>
  <text x="436" y="170" fill="#5A7AAA" font-size="10">① 告诉 AI：「先出方案，不要写代码」</text>
  <text x="436" y="188" fill="#5A7AAA" font-size="10">② 要求 AI 先画流程图（Mermaid）</text>
  <text x="436" y="204" fill="#5A7AAA" font-size="10">③ 方案确认后再执行，并追问影响范围</text>

  <text x="436" y="228" fill="#2B5090" font-size="11" font-weight="bold">为什么有效</text>
  <text x="436" y="244" fill="#5A7AAA" font-size="10">方案阶段改 10 遍零成本</text>
  <text x="436" y="260" fill="#5A7AAA" font-size="10">代码固化后重构代价极高</text>
  <text x="436" y="276" fill="#5A7AAA" font-size="10">30 分钟方案 = 省 2+ 小时修复</text>
</svg>
