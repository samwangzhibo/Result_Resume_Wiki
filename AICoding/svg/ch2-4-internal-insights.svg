<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.10"/></filter>
    <linearGradient id="gTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A3060"/>
      <stop offset="100%" style="stop-color:#3A60A0"/>
    </linearGradient>
  </defs>
  <rect width="860" height="320" fill="#F7FAFF" rx="8"/>
  <rect x="0" y="0" width="860" height="44" fill="url(#gTitle)" rx="8"/>
  <rect x="0" y="32" width="860" height="12" fill="url(#gTitle)"/>
  <text x="430" y="26" text-anchor="middle" fill="white" font-size="14" font-weight="bold">公司内同事实践共识：建系统地图 + 立约束边界 + 跑反馈闭环</text>

  <!-- 5篇文章卡片 -->
  <!-- 文章1 -->
  <rect x="18" y="56" width="158" height="242" rx="8" fill="white" stroke="#5B8DD9" stroke-width="1.5" filter="url(#s)"/>
  <rect x="18" y="56" width="158" height="32" rx="8" fill="#5B8DD9"/>
  <rect x="18" y="76" width="158" height="12" fill="#5B8DD9"/>
  <text x="97" y="76" text-anchor="middle" fill="white" font-size="10" font-weight="bold">SDD + TDD 实践</text>
  <text x="97" y="116" text-anchor="middle" fill="#2B5090" font-size="10" font-weight="bold">Meta Skill</text>
  <text x="97" y="132" text-anchor="middle" fill="#2B5090" font-size="10" font-weight="bold">让 AI 自动生成 Spec</text>
  <line x1="34" y1="144" x2="160" y2="144" stroke="#E0E8F0" stroke-width="1"/>
  <text x="97" y="164" text-anchor="middle" fill="#5A7AAA" font-size="10">复杂性前移消化</text>
  <text x="97" y="180" text-anchor="middle" fill="#5A7AAA" font-size="10">Spec 阶段消化后</text>
  <text x="97" y="196" text-anchor="middle" fill="#5A7AAA" font-size="10">执行返工大幅减少</text>
  <rect x="34" y="270" width="124" height="22" rx="4" fill="#E8F2FF"/>
  <text x="96" y="284" text-anchor="middle" fill="#2B5090" font-size="9" font-weight="bold">Spec = 前移复杂度</text>

  <!-- 文章2 -->
  <rect x="188" y="56" width="158" height="242" rx="8" fill="white" stroke="#9B6DC8" stroke-width="1.5" filter="url(#s)"/>
  <rect x="188" y="56" width="158" height="32" rx="8" fill="#9B6DC8"/>
  <rect x="188" y="76" width="158" height="12" fill="#9B6DC8"/>
  <text x="267" y="76" text-anchor="middle" fill="white" font-size="10" font-weight="bold">接住 10PD 任务</text>
  <text x="267" y="116" text-anchor="middle" fill="#4A2070" font-size="10" font-weight="bold">先反问澄清</text>
  <text x="267" y="132" text-anchor="middle" fill="#4A2070" font-size="10" font-weight="bold">再形成 Spec</text>
  <line x1="204" y1="144" x2="330" y2="144" stroke="#E0E8F0" stroke-width="1"/>
  <text x="267" y="164" text-anchor="middle" fill="#7A4AAA" font-size="10">先讨论形成真实 Spec</text>
  <text x="267" y="180" text-anchor="middle" fill="#7A4AAA" font-size="10">再进入计划和执行</text>
  <text x="267" y="196" text-anchor="middle" fill="#7A4AAA" font-size="10">任务越大越值得</text>
  <rect x="204" y="270" width="124" height="22" rx="4" fill="#F0E8FC"/>
  <text x="267" y="284" text-anchor="middle" fill="#4A2070" font-size="9" font-weight="bold">目标澄清 = 最高 ROI</text>

  <!-- 文章3 -->
  <rect x="358" y="56" width="158" height="242" rx="8" fill="white" stroke="#E08020" stroke-width="1.5" filter="url(#s)"/>
  <rect x="358" y="56" width="158" height="32" rx="8" fill="#E08020"/>
  <rect x="358" y="76" width="158" height="12" fill="#E08020"/>
  <text x="437" y="76" text-anchor="middle" fill="white" font-size="10" font-weight="bold">高效完成需求开发</text>
  <text x="437" y="116" text-anchor="middle" fill="#7A4000" font-size="10" font-weight="bold">人的价值转向决策</text>
  <text x="437" y="132" text-anchor="middle" fill="#7A4000" font-size="10" font-weight="bold">Skill 是竞争壁垒</text>
  <line x1="374" y1="144" x2="500" y2="144" stroke="#E0E8F0" stroke-width="1"/>
  <text x="437" y="164" text-anchor="middle" fill="#AA6020" font-size="10">AI 越强技术设计越重要</text>
  <text x="437" y="180" text-anchor="middle" fill="#AA6020" font-size="10">给错方向就全盘皆错</text>
  <text x="437" y="196" text-anchor="middle" fill="#AA6020" font-size="10">设计环节投入反而要加大</text>
  <rect x="374" y="270" width="124" height="22" rx="4" fill="#FFF8E8"/>
  <text x="437" y="284" text-anchor="middle" fill="#7A4000" font-size="9" font-weight="bold">设计 = 永远的核心</text>

  <!-- 文章4 -->
  <rect x="528" y="56" width="158" height="242" rx="8" fill="white" stroke="#3A9A3A" stroke-width="1.5" filter="url(#s)"/>
  <rect x="528" y="56" width="158" height="32" rx="8" fill="#3A9A3A"/>
  <rect x="528" y="76" width="158" height="12" fill="#3A9A3A"/>
  <text x="607" y="76" text-anchor="middle" fill="white" font-size="10" font-weight="bold">被 AI 折磨后的协作方式</text>
  <text x="607" y="116" text-anchor="middle" fill="#1A5A1A" font-size="10" font-weight="bold">六大核心洞察</text>
  <text x="607" y="132" text-anchor="middle" fill="#1A5A1A" font-size="10" font-weight="bold">含 AGENTS.md 规则</text>
  <line x1="544" y1="144" x2="670" y2="144" stroke="#E0E8F0" stroke-width="1"/>
  <text x="607" y="164" text-anchor="middle" fill="#5A9A5A" font-size="10">AI 不是不聪明</text>
  <text x="607" y="180" text-anchor="middle" fill="#5A9A5A" font-size="10">是对项目一无所知</text>
  <text x="607" y="196" text-anchor="middle" fill="#5A9A5A" font-size="10">给它上下文是关键</text>
  <rect x="544" y="270" width="124" height="22" rx="4" fill="#E8F8E8"/>
  <text x="607" y="284" text-anchor="middle" fill="#1A5A1A" font-size="9" font-weight="bold">规则文件 = 长期记忆</text>

  <!-- 文章5 -->
  <rect x="698" y="56" width="146" height="242" rx="8" fill="#2D3E56" filter="url(#s)"/>
  <rect x="698" y="56" width="146" height="32" rx="8" fill="#445570"/>
  <rect x="698" y="76" width="146" height="12" fill="#445570"/>
  <text x="771" y="76" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Agentic Coding</text>
  <text x="771" y="116" text-anchor="middle" fill="white" font-size="10" font-weight="bold">Java 架构分析 Skill</text>
  <text x="771" y="132" text-anchor="middle" fill="white" font-size="10" font-weight="bold">系统地图预沉淀</text>
  <line x1="714" y1="144" x2="828" y2="144" stroke="#445570" stroke-width="1"/>
  <text x="771" y="164" text-anchor="middle" fill="#AACCFF" font-size="10">改动点覆盖率</text>
  <text x="771" y="180" text-anchor="middle" fill="#AACCFF" font-size="10">60% → 95%</text>
  <text x="771" y="196" text-anchor="middle" fill="#AACCFF" font-size="10">从临时搜索到看图施工</text>
  <rect x="714" y="270" width="114" height="22" rx="4" fill="#3A4E62"/>
  <text x="771" y="284" text-anchor="middle" fill="#AACCFF" font-size="9" font-weight="bold">地图 = AI 的眼睛</text>
</svg>
