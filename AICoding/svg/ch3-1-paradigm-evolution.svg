<svg xmlns="http://www.w3.org/2000/svg" width="840" height="500" viewBox="0 0 840 500" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#5B8DD9"/>
    </marker>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <linearGradient id="gTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A3060"/>
      <stop offset="100%" style="stop-color:#3A60A0"/>
    </linearGradient>
  </defs>
  <rect width="840" height="500" fill="#F7FAFF" rx="8"/>
  <rect x="0" y="0" width="840" height="46" fill="url(#gTitle)" rx="8"/>
  <rect x="0" y="34" width="840" height="12" fill="url(#gTitle)"/>
  <text x="420" y="28" text-anchor="middle" fill="white" font-size="16" font-weight="bold">AI Coding 工程范式演进</text>

  <!-- 时间轴 -->
  <line x1="50" y1="82" x2="800" y2="82" stroke="#5B8DD9" stroke-width="2"/>
  <polygon points="800,77 812,82 800,87" fill="#5B8DD9"/>
  <text x="820" y="86" fill="#5B8DD9" font-size="11">时间</text>
  <!-- 时间刻度 -->
  <line x1="140" y1="77" x2="140" y2="87" stroke="#5B8DD9" stroke-width="2"/>
  <text x="140" y="100" text-anchor="middle" fill="#2B5090" font-size="11">2022-2023</text>
  <line x1="420" y1="77" x2="420" y2="87" stroke="#5B8DD9" stroke-width="2"/>
  <text x="420" y="100" text-anchor="middle" fill="#2B5090" font-size="11">2024</text>
  <line x1="680" y1="77" x2="680" y2="87" stroke="#5B8DD9" stroke-width="2"/>
  <text x="680" y="100" text-anchor="middle" fill="#2B5090" font-size="11">2025 至今</text>

  <!-- 第一代：Prompt Engineering -->
  <rect x="30" y="110" width="240" height="170" rx="10" fill="#E8F8E8" stroke="#3A9A3A" stroke-width="2" filter="url(#s)"/>
  <rect x="30" y="110" width="240" height="36" rx="10" fill="#3A9A3A"/>
  <rect x="30" y="134" width="240" height="12" fill="#3A9A3A"/>
  <text x="150" y="133" text-anchor="middle" fill="white" font-size="13" font-weight="bold">第一代：Prompt Engineering</text>
  <text x="150" y="160" text-anchor="middle" fill="#1A5A1A" font-size="11" font-weight="bold">核心假设</text>
  <text x="150" y="176" text-anchor="middle" fill="#5A9A5A" font-size="10">学会写好 Prompt = 好结果</text>
  <text x="150" y="200" text-anchor="middle" fill="#1A5A1A" font-size="11" font-weight="bold">局限</text>
  <text x="150" y="216" text-anchor="middle" fill="#C06060" font-size="10">• Prompt 太脆弱，换场景失效</text>
  <text x="150" y="230" text-anchor="middle" fill="#C06060" font-size="10">• 知识散落，团队无法复用</text>
  <text x="150" y="244" text-anchor="middle" fill="#C06060" font-size="10">• 只看对话窗口，全局偏差</text>
  <text x="150" y="265" text-anchor="middle" fill="#888" font-size="9">优化的是单次对话</text>

  <!-- 箭头1 -->
  <line x1="270" y1="195" x2="308" y2="195" stroke="#5B8DD9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="289" y="188" text-anchor="middle" fill="#C03030" font-size="9" font-weight="bold">局限暴露</text>

  <!-- 第二代：Context Engineering -->
  <rect x="310" y="110" width="240" height="170" rx="10" fill="#FFF8E8" stroke="#E08020" stroke-width="2" filter="url(#s)"/>
  <rect x="310" y="110" width="240" height="36" rx="10" fill="#E08020"/>
  <rect x="310" y="134" width="240" height="12" fill="#E08020"/>
  <text x="430" y="133" text-anchor="middle" fill="white" font-size="13" font-weight="bold">第二代：Context Engineering</text>
  <text x="430" y="160" text-anchor="middle" fill="#7A4000" font-size="11" font-weight="bold">核心认知</text>
  <text x="430" y="176" text-anchor="middle" fill="#AA6020" font-size="10">上下文才是核心竞争力</text>
  <text x="430" y="200" text-anchor="middle" fill="#7A4000" font-size="11" font-weight="bold">实践</text>
  <text x="430" y="216" text-anchor="middle" fill="#AA6020" font-size="10">AGENTS.md / RAG 检索</text>
  <text x="430" y="230" text-anchor="middle" fill="#AA6020" font-size="10">长上下文利用 / 规则文件</text>
  <text x="430" y="244" text-anchor="middle" fill="#C06060" font-size="10">• 上下文污染，行为不可预测</text>
  <text x="430" y="265" text-anchor="middle" fill="#888" font-size="9">优化的是信息投喂</text>

  <!-- 箭头2 -->
  <line x1="550" y1="195" x2="588" y2="195" stroke="#5B8DD9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="569" y="188" text-anchor="middle" fill="#C03030" font-size="9" font-weight="bold">规模瓶颈</text>

  <!-- 第三代：Harness Engineering -->
  <rect x="590" y="110" width="230" height="170" rx="10" fill="#2D3E56" filter="url(#s)"/>
  <rect x="590" y="110" width="230" height="36" rx="10" fill="#1A2D46"/>
  <text x="705" y="133" text-anchor="middle" fill="white" font-size="13" font-weight="bold">第三代：Harness Engineering</text>
  <text x="705" y="160" text-anchor="middle" fill="#88BBDD" font-size="11" font-weight="bold">核心理念</text>
  <text x="705" y="176" text-anchor="middle" fill="#AACCFF" font-size="10">构建 Agent 可靠工作的环境</text>
  <text x="705" y="200" text-anchor="middle" fill="#88BBDD" font-size="11" font-weight="bold">三层框架</text>
  <text x="705" y="216" text-anchor="middle" fill="#AACCFF" font-size="10">知识层 + 约束层 + 反馈层</text>
  <text x="705" y="230" text-anchor="middle" fill="#66AACC" font-size="10">工程师角色：系统架构师</text>
  <text x="705" y="244" text-anchor="middle" fill="#66AACC" font-size="10">质量保障：约束不变量</text>
  <text x="705" y="265" text-anchor="middle" fill="#88BBDD" font-size="9">优化的是 Agent 工作环境</text>

  <!-- 对比表格 -->
  <rect x="30" y="296" width="790" height="186" rx="8" fill="white" stroke="#CCDDEE" stroke-width="1.5"/>
  <!-- 表头 -->
  <rect x="30" y="296" width="790" height="30" rx="8" fill="#E8F2FF"/>
  <rect x="30" y="312" width="790" height="14" fill="#E8F2FF"/>
  <text x="120" y="315" text-anchor="middle" fill="#2B5090" font-size="11" font-weight="bold">维度</text>
  <text x="295" y="315" text-anchor="middle" fill="#2B5090" font-size="11" font-weight="bold">Prompt Engineering</text>
  <text x="510" y="315" text-anchor="middle" fill="#2B5090" font-size="11" font-weight="bold">Context Engineering</text>
  <text x="725" y="315" text-anchor="middle" fill="#2B5090" font-size="11" font-weight="bold">Harness Engineering</text>
  <!-- 分割线 -->
  <line x1="195" y1="296" x2="195" y2="482" stroke="#CCDDEE" stroke-width="1"/>
  <line x1="415" y1="296" x2="415" y2="482" stroke="#CCDDEE" stroke-width="1"/>
  <line x1="615" y1="296" x2="615" y2="482" stroke="#CCDDEE" stroke-width="1"/>
  <!-- 行1 -->
  <line x1="30" y1="340" x2="820" y2="340" stroke="#E8EEF8" stroke-width="1"/>
  <text x="120" y="356" text-anchor="middle" fill="#4A5A70" font-size="10" font-weight="bold">核心问题</text>
  <text x="295" y="356" text-anchor="middle" fill="#5A7AAA" font-size="10">如何写好一个提示词</text>
  <text x="510" y="356" text-anchor="middle" fill="#5A7AAA" font-size="10">如何管理 Agent 的信息状态</text>
  <text x="725" y="356" text-anchor="middle" fill="#2B5090" font-size="10" font-weight="bold">如何构建可靠工作的环境</text>
  <!-- 行2 -->
  <line x1="30" y1="368" x2="820" y2="368" stroke="#E8EEF8" stroke-width="1"/>
  <text x="120" y="384" text-anchor="middle" fill="#4A5A70" font-size="10" font-weight="bold">工程师角色</text>
  <text x="295" y="384" text-anchor="middle" fill="#5A7AAA" font-size="10">提示词调优者</text>
  <text x="510" y="384" text-anchor="middle" fill="#5A7AAA" font-size="10">上下文设计师</text>
  <text x="725" y="384" text-anchor="middle" fill="#2B5090" font-size="10" font-weight="bold">系统 / 环境架构师</text>
  <!-- 行3 -->
  <line x1="30" y1="396" x2="820" y2="396" stroke="#E8EEF8" stroke-width="1"/>
  <text x="120" y="412" text-anchor="middle" fill="#4A5A70" font-size="10" font-weight="bold">质量保障</text>
  <text x="295" y="412" text-anchor="middle" fill="#5A7AAA" font-size="10">人工审查输出</text>
  <text x="510" y="412" text-anchor="middle" fill="#5A7AAA" font-size="10">精心设计上下文</text>
  <text x="725" y="412" text-anchor="middle" fill="#2B5090" font-size="10" font-weight="bold">约束不变量 + 自动化验证</text>
  <!-- 行4 -->
  <line x1="30" y1="424" x2="820" y2="424" stroke="#E8EEF8" stroke-width="1"/>
  <text x="120" y="440" text-anchor="middle" fill="#4A5A70" font-size="10" font-weight="bold">知识管理</text>
  <text x="295" y="440" text-anchor="middle" fill="#5A7AAA" font-size="10">散落在对话中</text>
  <text x="510" y="440" text-anchor="middle" fill="#5A7AAA" font-size="10">规则文件和文档</text>
  <text x="725" y="440" text-anchor="middle" fill="#2B5090" font-size="10" font-weight="bold">版本化、仓库内、可机械验证</text>
  <!-- 行5 -->
  <line x1="30" y1="452" x2="820" y2="452" stroke="#E8EEF8" stroke-width="1"/>
  <text x="120" y="468" text-anchor="middle" fill="#4A5A70" font-size="10" font-weight="bold">主要风险</text>
  <text x="295" y="468" text-anchor="middle" fill="#C06060" font-size="10">提示词失效 / 脆弱</text>
  <text x="510" y="468" text-anchor="middle" fill="#C06060" font-size="10">上下文污染 / 腐败</text>
  <text x="725" y="468" text-anchor="middle" fill="#C06060" font-size="10">代码漂移 / 架构侵蚀</text>
</svg>
