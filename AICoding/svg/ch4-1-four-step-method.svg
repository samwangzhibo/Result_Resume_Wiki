<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480"
     font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <linearGradient id="gTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A3060"/>
      <stop offset="100%" style="stop-color:#3A60A0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="480" fill="#F2F5FA"/>
  <rect x="0" y="0" width="900" height="50" fill="url(#gTitle)"/>
  <text x="450" y="28" text-anchor="middle" fill="white" font-size="17" font-weight="bold">需求拆解：人工草稿 + AI 追问的四步法</text>
  <text x="450" y="43" text-anchor="middle" fill="#AACCFF" font-size="11">拆解是人的事，反问是 AI 的事 · 先讨论再执行</text>

  <!-- 步骤0 -->
  <rect x="30" y="65" width="820" height="72" rx="8" fill="white" filter="url(#s)"/>
  <rect x="30" y="65" width="8" height="72" rx="4" fill="#B71C1C"/>
  <rect x="38" y="65" width="100" height="72" fill="#FFEBEE"/>
  <text x="88" y="96" text-anchor="middle" fill="#B71C1C" font-size="14" font-weight="bold">STEP 0</text>
  <text x="88" y="114" text-anchor="middle" fill="#B71C1C" font-size="11">人工草稿</text>
  <line x1="140" y1="70" x2="140" y2="133" stroke="#EEE" stroke-width="1"/>
  <text x="155" y="88" fill="#1565C0" font-size="11" font-weight="bold">👤 谁做：人</text>
  <text x="155" y="106" fill="#555" font-size="10">凭架构经验给出第一版粗拆</text>
  <text x="155" y="121" fill="#888" font-size="10">AI 不能从零开始拆，但可以追问是否遗漏、是否模糊</text>
  <line x1="530" y1="70" x2="530" y2="133" stroke="#EEE" stroke-width="1"/>
  <rect x="540" y="74" width="150" height="57" rx="5" fill="#E3F2FD"/>
  <text x="615" y="92" text-anchor="middle" fill="#1565C0" font-size="10" font-weight="bold">📦 产出</text>
  <text x="615" y="108" text-anchor="middle" fill="#1565C0" font-size="10">模块列表 + 初步边界</text>

  <line x1="450" y1="137" x2="450" y2="155" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 步骤1 -->
  <rect x="30" y="155" width="820" height="72" rx="8" fill="white" filter="url(#s)"/>
  <rect x="30" y="155" width="8" height="72" rx="4" fill="#1565C0"/>
  <rect x="38" y="155" width="100" height="72" fill="#E3F2FD"/>
  <text x="88" y="186" text-anchor="middle" fill="#1565C0" font-size="14" font-weight="bold">STEP 1</text>
  <text x="88" y="204" text-anchor="middle" fill="#1565C0" font-size="11">AI 追问边界</text>
  <line x1="140" y1="160" x2="140" y2="223" stroke="#EEE" stroke-width="1"/>
  <text x="155" y="178" fill="#1565C0" font-size="11" font-weight="bold">🤖 谁做：AI</text>
  <text x="155" y="196" fill="#555" font-size="10">识别歧义点并追问：视觉稿确认？数据字段？风控接口？</text>
  <text x="155" y="211" fill="#888" font-size="10">印证："拆解是人的事，反问是 AI 的事"</text>
  <line x1="530" y1="160" x2="530" y2="223" stroke="#EEE" stroke-width="1"/>
  <rect x="540" y="164" width="150" height="57" rx="5" fill="#E3F2FD"/>
  <text x="615" y="182" text-anchor="middle" fill="#1565C0" font-size="10" font-weight="bold">📦 产出</text>
  <text x="615" y="198" text-anchor="middle" fill="#1565C0" font-size="10">边界澄清问题清单</text>

  <line x1="450" y1="227" x2="450" y2="245" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 步骤2 -->
  <rect x="30" y="245" width="820" height="72" rx="8" fill="white" filter="url(#s)"/>
  <rect x="30" y="245" width="8" height="72" rx="4" fill="#0277BD"/>
  <rect x="38" y="245" width="100" height="72" fill="#E1F5FE"/>
  <text x="88" y="276" text-anchor="middle" fill="#0277BD" font-size="14" font-weight="bold">STEP 2</text>
  <text x="88" y="294" text-anchor="middle" fill="#0277BD" font-size="11">AI 约束发现</text>
  <line x1="140" y1="250" x2="140" y2="313" stroke="#EEE" stroke-width="1"/>
  <text x="155" y="268" fill="#1565C0" font-size="11" font-weight="bold">🤖 谁做：AI</text>
  <text x="155" y="286" fill="#555" font-size="10">识别隐式约束：优先级互斥、跨团队协同、间内能力边界</text>
  <text x="155" y="301" fill="#888" font-size="10">AI 主动发现，人无法凭现有信息提前意识到</text>
  <line x1="530" y1="250" x2="530" y2="313" stroke="#EEE" stroke-width="1"/>
  <rect x="540" y="254" width="150" height="57" rx="5" fill="#E1F5FE"/>
  <text x="615" y="272" text-anchor="middle" fill="#0277BD" font-size="10" font-weight="bold">📦 产出</text>
  <text x="615" y="288" text-anchor="middle" fill="#0277BD" font-size="10">补充场景列表</text>

  <line x1="450" y1="317" x2="450" y2="335" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 步骤3 -->
  <rect x="30" y="335" width="820" height="72" rx="8" fill="white" filter="url(#s)"/>
  <rect x="30" y="335" width="8" height="72" rx="4" fill="#00695C"/>
  <rect x="38" y="335" width="100" height="72" fill="#E0F2F1"/>
  <text x="88" y="366" text-anchor="middle" fill="#00695C" font-size="14" font-weight="bold">STEP 3</text>
  <text x="88" y="384" text-anchor="middle" fill="#00695C" font-size="11">AI 粒度校准</text>
  <line x1="140" y1="340" x2="140" y2="403" stroke="#EEE" stroke-width="1"/>
  <text x="155" y="358" fill="#1B5E20" font-size="11" font-weight="bold">🤖 谁做：AI</text>
  <text x="155" y="376" fill="#555" font-size="10">对粗拆做粒度校准，标注每个模块的复杂度（高/中/低）</text>
  <text x="155" y="391" fill="#888" font-size="10">高复杂度标注 = 人需重点关注的风险模块</text>
  <line x1="530" y1="340" x2="530" y2="403" stroke="#EEE" stroke-width="1"/>
  <rect x="540" y="344" width="150" height="57" rx="5" fill="#E0F2F1"/>
  <text x="615" y="362" text-anchor="middle" fill="#00695C" font-size="10" font-weight="bold">📦 产出</text>
  <text x="615" y="378" text-anchor="middle" fill="#00695C" font-size="10">任务表 + 复杂度标记</text>

  <line x1="450" y1="407" x2="450" y2="425" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 步骤4 -->
  <rect x="30" y="425" width="820" height="40" rx="8" fill="#C8E6C9" filter="url(#s)"/>
  <rect x="30" y="425" width="8" height="40" rx="4" fill="#2E7D32"/>
  <text x="88" y="450" text-anchor="middle" fill="#1B5E20" font-size="13" font-weight="bold">STEP 4</text>
  <line x1="140" y1="430" x2="140" y2="462" stroke="#A5D6A7" stroke-width="1"/>
  <text x="250" y="440" fill="#1B5E20" font-size="11" font-weight="bold">👤 谁做：人</text>
  <text x="250" y="456" fill="#1B5E20" font-size="10">审核 AI 建议，确定优先级和执行顺序 → 可执行的技术模块拆解</text>
  <rect x="720" y="429" width="120" height="32" rx="5" fill="#2E7D32"/>
  <text x="780" y="444" text-anchor="middle" fill="white" font-size="10" font-weight="bold">📦 最终产出</text>
  <text x="780" y="457" text-anchor="middle" fill="#C8F5C8" font-size="9">可执行的技术模块拆解</text>
</svg>
