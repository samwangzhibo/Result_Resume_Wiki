<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580">
  <defs>
    <linearGradient id="gHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
    <linearGradient id="gCode" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e1e"/>
      <stop offset="100%" style="stop-color:#252526"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Header -->
  <rect x="0" y="0" width="900" height="40" fill="url(#gHeader)" rx="6"/>
  <text x="450" y="26" text-anchor="middle" fill="white" font-size="14" font-weight="bold">📄 constitution.md 示例（礼物模块项目）</text>
  
  <!-- Code block -->
  <g transform="translate(40, 55)">
    <rect x="0" y="0" width="820" height="500" fill="url(#gCode)" rx="8" filter="url(#shadow)"/>
    
    <!-- File header bar -->
    <rect x="0" y="0" width="820" height="28" fill="#2d2d2d" rx="8"/>
    <rect x="0" y="14" width="820" height="14" fill="#2d2d2d"/>
    <circle cx="20" cy="14" r="5" fill="#ff5f56"/>
    <circle cx="38" cy="14" r="5" fill="#ffbd2e"/>
    <circle cx="56" cy="14" r="5" fill="#27c93f"/>
    <text x="410" y="18" text-anchor="middle" fill="#888" font-size="10">constitution.md</text>
    
    <!-- Code content with syntax highlighting -->
    <text x="20" y="55" fill="#569cd6" font-size="11" font-family="Monaco, Consolas, monospace"># 核心架构原则</text>
    
    <text x="20" y="78" fill="#ce9178" font-size="11" font-family="Monaco, Consolas, monospace">## I. 分层架构约束</text>
    <text x="20" y="98" fill="#d4d4d4" font-size="11" font-family="Monaco, Consolas, monospace">所有代码必须遵循 MVP 分层：</text>
    <text x="40" y="118" fill="#6a9955" font-size="11" font-family="Monaco, Consolas, monospace">• Model：数据模型，纯数据类</text>
    <text x="40" y="138" fill="#6a9955" font-size="11" font-family="Monaco, Consolas, monospace">• View：UI 层，只处理展示逻辑</text>
    <text x="40" y="158" fill="#6a9955" font-size="11" font-family="Monaco, Consolas, monospace">• Presenter：业务逻辑层，协调 Model 和 View</text>
    <text x="40" y="178" fill="#f44747" font-size="11" font-family="Monaco, Consolas, monospace">禁止 View 层直接调用 Model</text>
    
    <text x="20" y="208" fill="#ce9178" font-size="11" font-family="Monaco, Consolas, monospace">## II. 依赖注入原则</text>
    <text x="20" y="228" fill="#d4d4d4" font-size="11" font-family="Monaco, Consolas, monospace">所有跨层依赖必须通过构造函数注入：</text>
    <text x="40" y="248" fill="#569cd6" font-size="11" font-family="Monaco, Consolas, monospace">class</text>
    <text x="80" y="248" fill="#4ec9b0" font-size="11" font-family="Monaco, Consolas, monospace">GiftPresenter</text>
    <text x="175" y="248" fill="#569cd6" font-size="11" font-family="Monaco, Consolas, monospace">constructor</text>
    <text x="240" y="248" fill="#d4d4d4" font-size="11" font-family="Monaco, Consolas, monospace">(</text>
    <text x="252" y="248" fill="#569cd6" font-size="11" font-family="Monaco, Consolas, monospace">private</text>
    <text x="310" y="248" fill="#569cd6" font-size="11" font-family="Monaco, Consolas, monospace">val</text>
    <text x="335" y="248" fill="#9cdcfe" font-size="11" font-family="Monaco, Consolas, monospace">giftManager</text>
    <text x="410" y="248" fill="#d4d4d4" font-size="11" font-family="Monaco, Consolas, monospace">:</text>
    <text x="420" y="248" fill="#4ec9b0" font-size="11" font-family="Monaco, Consolas, monospace">GiftManager</text>
    <text x="510" y="248" fill="#d4d4d4" font-size="11" font-family="Monaco, Consolas, monospace">)</text>
    
    <text x="20" y="278" fill="#ce9178" font-size="11" font-family="Monaco, Consolas, monospace">## III. 命名规范</text>
    <text x="40" y="298" fill="#6a9955" font-size="11" font-family="Monaco, Consolas, monospace">• Presenter 命名：[功能]Presenter（如 GiftPanelPresenter）</text>
    <text x="40" y="318" fill="#6a9955" font-size="11" font-family="Monaco, Consolas, monospace">• Manager 命名：[业务域]Manager（如 GiftAudienceManager）</text>
    <text x="40" y="338" fill="#6a9955" font-size="11" font-family="Monaco, Consolas, monospace">• 方法命名：动词开头（sendGift, loadPanel, handleCombo）</text>
    
    <text x="20" y="368" fill="#ce9178" font-size="11" font-family="Monaco, Consolas, monospace">## IV. 日志规范</text>
    <text x="40" y="388" fill="#d4d4d4" font-size="11" font-family="Monaco, Consolas, monospace">关键节点必须打点：</text>
    <text x="40" y="408" fill="#569cd6" font-size="11" font-family="Monaco, Consolas, monospace">LogUtil</text>
    <text x="90" y="408" fill="#d4d4d4" font-size="11" font-family="Monaco, Consolas, monospace">.</text>
    <text x="98" y="408" fill="#dcdcaa" font-size="11" font-family="Monaco, Consolas, monospace">d</text>
    <text x="110" y="408" fill="#d4d4d4" font-size="11" font-family="Monaco, Consolas, monospace">(</text>
    <text x="120" y="408" fill="#ce9178" font-size="11" font-family="Monaco, Consolas, monospace">"GiftPresenter, sendGift, giftId=$giftId"</text>
    <text x="410" y="408" fill="#d4d4d4" font-size="11" font-family="Monaco, Consolas, monospace">)</text>
    
    <text x="20" y="438" fill="#ce9178" font-size="11" font-family="Monaco, Consolas, monospace">## V. 错误处理</text>
    <text x="40" y="458" fill="#d4d4d4" font-size="11" font-family="Monaco, Consolas, monospace">所有网络请求必须有 try-catch 包裹：</text>
    <text x="40" y="478" fill="#c586c0" font-size="11" font-family="Monaco, Consolas, monospace">try</text>
    <text x="65" y="478" fill="#d4d4d4" font-size="11" font-family="Monaco, Consolas, monospace"> { response = api.sendGift(req) }</text>
    <text x="40" y="498" fill="#c586c0" font-size="11" font-family="Monaco, Consolas, monospace">catch</text>
    <text x="75" y="498" fill="#d4d4d4" font-size="11" font-family="Monaco, Consolas, monospace"> (e: Exception) { LogUtil.e(e); onError(e) }</text>
  </g>
</svg>