<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540"
     font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <filter id="s2"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.08"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#888"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2E7D32"/>
    </marker>
    <linearGradient id="gTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B71C1C"/>
      <stop offset="100%" style="stop-color:#D32F2F"/>
    </linearGradient>
  </defs>

  <rect width="940" height="540" fill="#F2F5FA"/>
  <rect x="0" y="0" width="940" height="50" fill="url(#gTitle)"/>
  <text x="470" y="27" text-anchor="middle" fill="white" font-size="17" font-weight="bold">KMP 连麦画面静止：结构化问题现场排查</text>
  <text x="470" y="43" text-anchor="middle" fill="#FFCCCC" font-size="11">多团队协作 · 信息残缺 · AI 做「信息聚合分析」</text>

  <!-- 步骤1 -->
  <rect x="20" y="62" width="900" height="90" rx="8" fill="white" filter="url(#s)"/>
  <rect x="20" y="62" width="8" height="90" rx="4" fill="#B71C1C"/>
  <rect x="28" y="62" width="74" height="90" fill="#FFEBEE"/>
  <text x="65" y="95" text-anchor="middle" fill="#B71C1C" font-size="12" font-weight="bold">Step 1</text>
  <text x="65" y="112" text-anchor="middle" fill="#B71C1C" font-size="10">结构化</text>
  <text x="65" y="125" text-anchor="middle" fill="#B71C1C" font-size="10">整理现场</text>
  <line x1="104" y1="67" x2="104" y2="148" stroke="#EEE" stroke-width="1"/>
  <text x="118" y="84" fill="#C62828" font-size="11" font-weight="bold">❌ 错误姿势</text>
  <text x="118" y="100" fill="#888" font-size="10">直接把零散信息（用户描述+录屏+直播ID）扔给AI → 泛化假设「可能是网络/编解码/权限」</text>
  <text x="118" y="114" fill="#888" font-size="10">逐个验证浪费 40 分钟 → 都不是根因</text>

  <line x1="460" y1="67" x2="460" y2="148" stroke="#EEE" stroke-width="1"/>
  <text x="474" y="84" fill="#2E7D32" font-size="11" font-weight="bold">✅ 正确姿势：先结构化</text>
  <rect x="474" y="90" width="430" height="52" rx="5" fill="#E8F5E9"/>
  <text x="484" y="105" fill="#1B5E20" font-size="10">[现象] 有声无画 → 音视频分离 → 推流端未正常发 video track</text>
  <text x="484" y="118" fill="#1B5E20" font-size="10">[版本] 14.2.30 KMP开关已放量50%  [时间] 2026-03-25 15:50</text>
  <text x="484" y="131" fill="#1B5E20" font-size="10">[已排除] 网络正常，重启App无效  [数据来源] 音视频+medata诊断</text>

  <line x1="470" y1="152" x2="470" y2="170" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 步骤2 -->
  <rect x="20" y="170" width="900" height="110" rx="8" fill="white" filter="url(#s)"/>
  <rect x="20" y="170" width="8" height="110" rx="4" fill="#1565C0"/>
  <rect x="28" y="170" width="74" height="110" fill="#E3F2FD"/>
  <text x="65" y="203" text-anchor="middle" fill="#1565C0" font-size="12" font-weight="bold">Step 2</text>
  <text x="65" y="220" text-anchor="middle" fill="#1565C0" font-size="10">多团队</text>
  <text x="65" y="237" text-anchor="middle" fill="#1565C0" font-size="10">信息拼图</text>
  <line x1="104" y1="175" x2="104" y2="276" stroke="#EEE" stroke-width="1"/>
  <text x="118" y="193" fill="#1565C0" font-size="11" font-weight="bold">AI 做「信息聚合分析」—— 把4个来源拼成时间线</text>
  <!-- 四个来源 -->
  <rect x="118" y="198" width="180" height="50" rx="5" fill="#E3F2FD" filter="url(#s2)"/>
  <text x="128" y="213" fill="#1565C0" font-size="10" font-weight="bold">音视频连麦记录</text>
  <text x="128" y="227" fill="#555" font-size="9">本端主播未正常发送video</text>

  <rect x="310" y="198" width="180" height="50" rx="5" fill="#E3F2FD" filter="url(#s2)"/>
  <text x="320" y="213" fill="#1565C0" font-size="10" font-weight="bold">medata直播诊断</text>
  <text x="320" y="227" fill="#555" font-size="9">连麦一直在重复进房</text>

  <rect x="502" y="198" width="220" height="50" rx="5" fill="#E3F2FD" filter="url(#s2)"/>
  <text x="512" y="213" fill="#1565C0" font-size="10" font-weight="bold">客户端日志</text>
  <text x="512" y="227" fill="#555" font-size="9">channel id not match</text>
  <text x="512" y="241" fill="#555" font-size="9">G9Zk... vs TQjp...</text>

  <rect x="734" y="198" width="178" height="50" rx="5" fill="#E3F2FD" filter="url(#s2)"/>
  <text x="744" y="213" fill="#1565C0" font-size="10" font-weight="bold">火眼+Arya上报</text>
  <text x="744" y="227" fill="#555" font-size="9">13:32退房失败后</text>
  <text x="744" y="241" fill="#555" font-size="9">连续进入3个PK房间</text>

  <line x1="470" y1="280" x2="470" y2="298" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 步骤3 -->
  <rect x="20" y="298" width="900" height="100" rx="8" fill="white" filter="url(#s)"/>
  <rect x="20" y="298" width="8" height="100" rx="4" fill="#00695C"/>
  <rect x="28" y="298" width="74" height="100" fill="#E0F2F1"/>
  <text x="65" y="331" text-anchor="middle" fill="#00695C" font-size="12" font-weight="bold">Step 3</text>
  <text x="65" y="348" text-anchor="middle" fill="#00695C" font-size="10">方向+代码</text>
  <text x="65" y="365" text-anchor="middle" fill="#00695C" font-size="10">路径分析</text>
  <line x1="104" y1="303" x2="104" y2="394" stroke="#EEE" stroke-width="1"/>
  <text x="118" y="321" fill="#00695C" font-size="11" font-weight="bold">有了方向，投喂「方向+代码上下文」，不是模糊症状</text>
  <rect x="118" y="328" width="415" height="58" rx="5" fill="#E0F2F1"/>
  <text x="128" y="344" fill="#004D40" font-size="10">已知：reEnter场景下退房失败，channelId使用错误</text>
  <text x="128" y="358" fill="#004D40" font-size="10">相关类：LiveRTCManagerWrapperImpl、snowRtcObserverMap</text>
  <text x="128" y="372" fill="#004D40" font-size="10">帮我分析：snowRtcObserverMap在release()时clear，会对后续有什么影响？</text>

  <rect x="546" y="328" width="366" height="58" rx="5" fill="#C8E6C9"/>
  <text x="556" y="344" fill="#1B5E20" font-size="10" font-weight="bold">AI 推演时序：</text>
  <text x="556" y="358" fill="#1B5E20" font-size="10">release()清掉映射 → 反注册失效 → 旧Observer残留</text>
  <text x="556" y="372" fill="#1B5E20" font-size="10">→ 时序错乱：enterRoom在engine未释放时就执行</text>

  <line x1="470" y1="398" x2="470" y2="416" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 步骤4 -->
  <rect x="20" y="416" width="900" height="72" rx="8" fill="white" filter="url(#s)"/>
  <rect x="20" y="416" width="8" height="72" rx="4" fill="#E65100"/>
  <rect x="28" y="416" width="74" height="72" fill="#FFF3E0"/>
  <text x="65" y="449" text-anchor="middle" fill="#E65100" font-size="12" font-weight="bold">Step 4</text>
  <text x="65" y="467" text-anchor="middle" fill="#E65100" font-size="10">修复+影响面</text>
  <line x1="104" y1="421" x2="104" y2="484" stroke="#EEE" stroke-width="1"/>
  <text x="118" y="439" fill="#E65100" font-size="11" font-weight="bold">修复方案验收 + 影响面追问</text>
  <text x="118" y="455" fill="#555" font-size="10">「列出影响范围，按严重程度倒排」→ AI 输出影响面分析</text>
  <text x="118" y="470" fill="#555" font-size="10">影响面分析直接成为回测清单，缩短验收周期</text>
  <!-- 影响面标签 -->
  <rect x="620" y="424" width="132" height="22" rx="5" fill="#FFEBEE"/>
  <text x="686" y="439" text-anchor="middle" fill="#C62828" font-size="10">[高] reEnter时序修复</text>
  <rect x="762" y="424" width="150" height="22" rx="5" fill="#FFF8E1"/>
  <text x="837" y="439" text-anchor="middle" fill="#E65100" font-size="10">[中] 多房间并发验证</text>
  <rect x="620" y="452" width="132" height="22" rx="5" fill="#F1F8E9"/>
  <text x="686" y="467" text-anchor="middle" fill="#2E7D32" font-size="10">[低] 正常邀请无影响</text>

  <!-- 底部关键数字 -->
  <rect x="20" y="498" width="900" height="32" rx="8" fill="#E3F2FD" stroke="#1565C0" stroke-width="1.5"/>
  <text x="470" y="512" text-anchor="middle" fill="#1565C0" font-size="11" font-weight="bold">关键数字</text>
  <text x="470" y="526" text-anchor="middle" fill="#1565C0" font-size="11">代码时序推演环节：从原本需要 0.5 天 → AI 辅助 30 分钟内完成</text>
</svg>
