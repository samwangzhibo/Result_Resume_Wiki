<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.10"/></filter>
    <linearGradient id="gTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A3060"/>
      <stop offset="100%" style="stop-color:#3A60A0"/>
    </linearGradient>
  </defs>
  <rect width="820" height="320" fill="#F7FAFF" rx="8"/>
  <rect x="0" y="0" width="820" height="44" fill="url(#gTitle)" rx="8"/>
  <rect x="0" y="32" width="820" height="12" fill="url(#gTitle)"/>
  <text x="410" y="26" text-anchor="middle" fill="white" font-size="14" font-weight="bold">四大重点优化方向</text>

  <!-- 方向1 -->
  <rect x="20" y="56" width="184" height="244" rx="10" fill="#E8F2FF" stroke="#5B8DD9" stroke-width="1.5" filter="url(#s)"/>
  <rect x="20" y="56" width="184" height="34" rx="10" fill="#5B8DD9"/>
  <rect x="20" y="78" width="184" height="12" fill="#5B8DD9"/>
  <text x="112" y="78" text-anchor="middle" fill="white" font-size="12" font-weight="bold">业务 Spec 体系</text>
  <text x="112" y="112" text-anchor="middle" fill="#2B5090" font-size="10" font-weight="bold">核心短板</text>
  <text x="112" y="128" text-anchor="middle" fill="#5A7AAA" font-size="10">业务语义无法传给 AI</text>
  <text x="112" y="152" text-anchor="middle" fill="#2B5090" font-size="10" font-weight="bold">解法</text>
  <text x="112" y="168" text-anchor="middle" fill="#5A7AAA" font-size="10">核心模块逐步建立</text>
  <text x="112" y="184" text-anchor="middle" fill="#5A7AAA" font-size="10">业务维度矩阵</text>
  <text x="112" y="200" text-anchor="middle" fill="#5A7AAA" font-size="10">互斥规则文档</text>
  <text x="112" y="216" text-anchor="middle" fill="#5A7AAA" font-size="10">历史决策记录</text>
  <rect x="32" y="268" width="160" height="24" rx="4" fill="#D0E8FF"/>
  <text x="112" y="283" text-anchor="middle" fill="#2B5090" font-size="10" font-weight="bold">效果呈复利增长</text>

  <!-- 方向2 -->
  <rect x="220" y="56" width="184" height="244" rx="10" fill="#F0E8FC" stroke="#9B6DC8" stroke-width="1.5" filter="url(#s)"/>
  <rect x="220" y="56" width="184" height="34" rx="10" fill="#9B6DC8"/>
  <rect x="220" y="78" width="184" height="12" fill="#9B6DC8"/>
  <text x="312" y="78" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Skill 体系沉淀</text>
  <text x="312" y="112" text-anchor="middle" fill="#4A2070" font-size="10" font-weight="bold">已有积累</text>
  <text x="312" y="128" text-anchor="middle" fill="#7A4AAA" font-size="10">CR Skill（分层约束）</text>
  <text x="312" y="144" text-anchor="middle" fill="#7A4AAA" font-size="10">影响范围评估 Prompt</text>
  <text x="312" y="160" text-anchor="middle" fill="#7A4AAA" font-size="10">Debug 分析 Prompt</text>
  <text x="312" y="184" text-anchor="middle" fill="#4A2070" font-size="10" font-weight="bold">下一步</text>
  <text x="312" y="200" text-anchor="middle" fill="#7A4AAA" font-size="10">每次发现 AI 错误</text>
  <text x="312" y="216" text-anchor="middle" fill="#7A4AAA" font-size="10">花 5 分钟写进 Skill</text>
  <rect x="232" y="268" width="160" height="24" rx="4" fill="#E0D0F0"/>
  <text x="312" y="283" text-anchor="middle" fill="#4A2070" font-size="10" font-weight="bold">让错误永不再犯</text>

  <!-- 方向3 -->
  <rect x="420" y="56" width="184" height="244" rx="10" fill="#FFF8E8" stroke="#E08020" stroke-width="1.5" filter="url(#s)"/>
  <rect x="420" y="56" width="184" height="34" rx="10" fill="#E08020"/>
  <rect x="420" y="78" width="184" height="12" fill="#E08020"/>
  <text x="512" y="78" text-anchor="middle" fill="white" font-size="12" font-weight="bold">Debug 自动化</text>
  <text x="512" y="112" text-anchor="middle" fill="#7A4000" font-size="10" font-weight="bold">实验暴露的边界</text>
  <text x="512" y="128" text-anchor="middle" fill="#AA6020" font-size="10">代码有多潜在问题时</text>
  <text x="512" y="144" text-anchor="middle" fill="#AA6020" font-size="10">全自主修复容易打地鼠</text>
  <text x="512" y="168" text-anchor="middle" fill="#7A4000" font-size="10" font-weight="bold">改进方向</text>
  <text x="512" y="184" text-anchor="middle" fill="#AA6020" font-size="10">人先确认根因骨架方向</text>
  <text x="512" y="200" text-anchor="middle" fill="#AA6020" font-size="10">AI 在骨架内执行修复</text>
  <text x="512" y="216" text-anchor="middle" fill="#AA6020" font-size="10">预埋日志提升信息完整度</text>
  <rect x="432" y="268" width="160" height="24" rx="4" fill="#FFE8C0"/>
  <text x="512" y="283" text-anchor="middle" fill="#7A4000" font-size="10" font-weight="bold">骨架由人定，执行归 AI</text>

  <!-- 方向4 -->
  <rect x="620" y="56" width="184" height="244" rx="10" fill="#E8F8E8" stroke="#3A9A3A" stroke-width="1.5" filter="url(#s)"/>
  <rect x="620" y="56" width="184" height="34" rx="10" fill="#3A9A3A"/>
  <rect x="620" y="78" width="184" height="12" fill="#3A9A3A"/>
  <text x="712" y="78" text-anchor="middle" fill="white" font-size="12" font-weight="bold">测试自动化</text>
  <text x="712" y="112" text-anchor="middle" fill="#1A5A1A" font-size="10" font-weight="bold">潜力最大的方向</text>
  <text x="712" y="128" text-anchor="middle" fill="#5A9A5A" font-size="10">当前投入最少</text>
  <text x="712" y="152" text-anchor="middle" fill="#1A5A1A" font-size="10" font-weight="bold">参考行业实践</text>
  <text x="712" y="168" text-anchor="middle" fill="#5A9A5A" font-size="10">字节 ABCoder：</text>
  <text x="712" y="184" text-anchor="middle" fill="#5A9A5A" font-size="10">单方法覆盖率 83%</text>
  <text x="712" y="200" text-anchor="middle" fill="#5A9A5A" font-size="10">从最稳定模块开始</text>
  <text x="712" y="216" text-anchor="middle" fill="#5A9A5A" font-size="10">逐步建立 TDD 习惯</text>
  <rect x="632" y="268" width="160" height="24" rx="4" fill="#C8ECC8"/>
  <text x="712" y="283" text-anchor="middle" fill="#1A5A1A" font-size="10" font-weight="bold">测试 = AI 行为的验收者</text>
</svg>
