<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
    <linearGradient id="gTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A3060"/>
      <stop offset="100%" style="stop-color:#3A60A0"/>
    </linearGradient>
  </defs>
  <rect width="720" height="420" fill="#F7FAFF" rx="8"/>
  <rect x="0" y="0" width="720" height="44" fill="url(#gTitle)" rx="8"/>
  <rect x="0" y="32" width="720" height="12" fill="url(#gTitle)"/>
  <text x="360" y="26" text-anchor="middle" fill="white" font-size="15" font-weight="bold">从"T 型人才"到"π 型人才"</text>

  <!-- T型图示 -->
  <text x="160" y="72" text-anchor="middle" fill="#C03030" font-size="13" font-weight="bold">T 型（传统）</text>
  <!-- T横线 -->
  <rect x="60" y="82" width="200" height="22" rx="4" fill="#AACCEE" stroke="#5B8DD9" stroke-width="1.5"/>
  <text x="160" y="97" text-anchor="middle" fill="#2B5090" font-size="11">通用技能（一项浅度覆盖）</text>
  <!-- T竖线 -->
  <rect x="142" y="104" width="36" height="200" rx="4" fill="#5B8DD9"/>
  <text x="160" y="184" text-anchor="middle" fill="white" font-size="11" transform="rotate(-90,160,184)">深度技术能力</text>

  <!-- π型图示 -->
  <text x="540" y="72" text-anchor="middle" fill="#2B5090" font-size="13" font-weight="bold">π 型（AI 时代）</text>
  <!-- π横线（AI驾驭能力） -->
  <rect x="390" y="82" width="300" height="22" rx="4" fill="#9B6DC8" stroke="#7A4AAA" stroke-width="1.5"/>
  <text x="540" y="97" text-anchor="middle" fill="white" font-size="11" font-weight="bold">AI 驾驭能力（横线：通用工具层）</text>
  <!-- π左竖线（深度技术） -->
  <rect x="415" y="104" width="36" height="200" rx="4" fill="#5B8DD9"/>
  <text x="433" y="184" text-anchor="middle" fill="white" font-size="11" transform="rotate(-90,433,184)">深度技术能力</text>
  <!-- π右竖线（业务理解） -->
  <rect x="639" y="104" width="36" height="200" rx="4" fill="#E08020"/>
  <text x="657" y="184" text-anchor="middle" fill="white" font-size="11" transform="rotate(-90,657,184)">深度业务理解</text>

  <!-- 对比说明 -->
  <text x="160" y="328" text-anchor="middle" fill="#888" font-size="11">一项专业深度</text>
  <text x="160" y="346" text-anchor="middle" fill="#888" font-size="11">+ 多项浅度覆盖</text>

  <text x="540" y="316" text-anchor="middle" fill="#4A2070" font-size="11" font-weight="bold">两项专业深度（技术 + 业务）</text>
  <text x="540" y="334" text-anchor="middle" fill="#4A2070" font-size="11" font-weight="bold">+ AI 驾驭能力作为放大器</text>

  <!-- 箭头 -->
  <line x1="270" y1="192" x2="388" y2="192" stroke="#C03030" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="386,188 396,192 386,196" fill="#C03030"/>
  <text x="329" y="184" text-anchor="middle" fill="#C03030" font-size="10" font-weight="bold">升级为</text>

  <!-- 三缺一说明 -->
  <rect x="390" y="360" width="300" height="48" rx="6" fill="#2D3E56"/>
  <text x="540" y="381" text-anchor="middle" fill="white" font-size="11" font-weight="bold">三者缺一不可</text>
  <text x="540" y="399" text-anchor="middle" fill="#AACCFF" font-size="10">只有技术→给 AI 方向会偏 ｜ 没有 AI 能力→人效被甩开 ｜ 只有业务→无法验收 AI 输出</text>
</svg>
