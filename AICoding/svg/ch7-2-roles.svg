<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.10"/></filter>
    <linearGradient id="gTitle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1A3060"/>
      <stop offset="100%" style="stop-color:#3A60A0"/>
    </linearGradient>
  </defs>
  <rect width="820" height="360" fill="#F7FAFF" rx="8"/>
  <rect x="0" y="0" width="820" height="44" fill="url(#gTitle)" rx="8"/>
  <rect x="0" y="32" width="820" height="12" fill="url(#gTitle)"/>
  <text x="410" y="26" text-anchor="middle" fill="white" font-size="14" font-weight="bold">不同角色的应对方向</text>

  <!-- 公司/团队 -->
  <rect x="20" y="56" width="240" height="280" rx="10" fill="#E8F2FF" stroke="#5B8DD9" stroke-width="1.5" filter="url(#s)"/>
  <rect x="20" y="56" width="240" height="32" rx="10" fill="#5B8DD9"/>
  <rect x="20" y="76" width="240" height="12" fill="#5B8DD9"/>
  <text x="140" y="77" text-anchor="middle" fill="white" font-size="13" font-weight="bold">公司 &amp; 团队层面</text>
  <text x="36" y="106" fill="#2B5090" font-size="11" font-weight="bold">晋升标准新增维度</text>
  <text x="36" y="124" fill="#5A7AAA" font-size="10">• 是否沉淀了可复用 Skill</text>
  <text x="36" y="140" fill="#5A7AAA" font-size="10">• 是否建立了模块 Spec 体系</text>
  <text x="36" y="156" fill="#5A7AAA" font-size="10">• 是否能让 AI 高效执行复杂需求</text>
  <text x="36" y="172" fill="#5A7AAA" font-size="10">• 是否培养了团队 AI Coding 能力</text>
  <text x="36" y="196" fill="#2B5090" font-size="11" font-weight="bold">人才选拔新偏好</text>
  <text x="36" y="214" fill="#5A7AAA" font-size="10">• 系统化思维（全局视角）</text>
  <text x="36" y="230" fill="#5A7AAA" font-size="10">• 业务理解深度（业务规则显式化）</text>
  <text x="36" y="246" fill="#5A7AAA" font-size="10">• 学习速度（工具链更新极快）</text>
  <text x="36" y="262" fill="#5A7AAA" font-size="10">• 文字表达能力（Context 工程核心）</text>
  <rect x="32" y="302" width="216" height="24" rx="4" fill="#D0E8FF"/>
  <text x="140" y="317" text-anchor="middle" fill="#2B5090" font-size="10" font-weight="bold">把 AI Coding 能力纳入 OKR 考核</text>

  <!-- 管理者 -->
  <rect x="280" y="56" width="240" height="280" rx="10" fill="#F0E8FC" stroke="#9B6DC8" stroke-width="1.5" filter="url(#s)"/>
  <rect x="280" y="56" width="240" height="32" rx="10" fill="#9B6DC8"/>
  <rect x="280" y="76" width="240" height="12" fill="#9B6DC8"/>
  <text x="400" y="77" text-anchor="middle" fill="white" font-size="13" font-weight="bold">管理者层面</text>
  <text x="296" y="106" fill="#4A2070" font-size="11" font-weight="bold">梯队设计的新逻辑</text>
  <text x="296" y="124" fill="#7A4AAA" font-size="10">最有价值的人 =</text>
  <text x="296" y="140" fill="#7A4AAA" font-size="10">"能设计系统、能判断方向</text>
  <text x="296" y="156" fill="#7A4AAA" font-size="10"> 能驾驭 AI 的人"</text>
  <text x="296" y="172" fill="#7A4AAA" font-size="10">而非"写代码最快的人"</text>
  <text x="296" y="196" fill="#4A2070" font-size="11" font-weight="bold">合理分配 AI 价值</text>
  <text x="296" y="214" fill="#7A4AAA" font-size="10">• 建团队级 AI 基础设施</text>
  <text x="296" y="230" fill="#7A4AAA" font-size="10">  （Skill 库 + AGENTS.md + Spec 模板）</text>
  <text x="296" y="246" fill="#7A4AAA" font-size="10">• 定期分享最佳实践</text>
  <text x="296" y="262" fill="#7A4AAA" font-size="10">• 减少"AI 收益不均"现象</text>
  <rect x="292" y="302" width="216" height="24" rx="4" fill="#E0D0F0"/>
  <text x="400" y="317" text-anchor="middle" fill="#4A2070" font-size="10" font-weight="bold">有人提效 10 倍，有人还在手写</text>

  <!-- 研发人员 -->
  <rect x="540" y="56" width="260" height="280" rx="10" fill="#2D3E56" filter="url(#s)"/>
  <rect x="540" y="56" width="260" height="32" rx="10" fill="#1A2D46"/>
  <text x="670" y="77" text-anchor="middle" fill="white" font-size="13" font-weight="bold">研发人员：立即可做</text>
  <text x="556" y="106" fill="#88BBDD" font-size="11" font-weight="bold">① 开始维护 AGENTS.md</text>
  <text x="556" y="122" fill="#AACCFF" font-size="10">核心架构约束 + 禁用写法</text>
  <text x="556" y="138" fill="#AACCFF" font-size="10">历史踩坑 + 每周更新一次</text>
  <text x="556" y="162" fill="#88BBDD" font-size="11" font-weight="bold">② 建立 Skill 文件习惯</text>
  <text x="556" y="178" fill="#AACCFF" font-size="10">每次发现 AI 犯错后</text>
  <text x="556" y="194" fill="#AACCFF" font-size="10">花 5 分钟把规则写进 Skill</text>
  <text x="556" y="218" fill="#88BBDD" font-size="11" font-weight="bold">③ 做一个模块的 Spec</text>
  <text x="556" y="234" fill="#AACCFF" font-size="10">选最熟悉的模块</text>
  <text x="556" y="250" fill="#AACCFF" font-size="10">2-3 小时写一份 SDD 框架</text>
  <text x="556" y="274" fill="#88BBDD" font-size="11" font-weight="bold">④ 主动分享</text>
  <text x="556" y="290" fill="#AACCFF" font-size="10">AI 时代个人知识更新</text>
  <text x="556" y="306" fill="#AACCFF" font-size="10">没有团队集体快</text>
  <rect x="552" y="316" width="236" height="14" rx="4" fill="#3A4E62"/>
  <text x="670" y="326" text-anchor="middle" fill="#AACCFF" font-size="9" font-weight="bold">越早积累，复利越大</text>
</svg>
