  <line x1="740" y1="200" x2="760" y2="200" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="740" y1="300" x2="760" y2="300" stroke="#90a4ae" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 底部备注 -->
  <text x="500" y="390" text-anchor="middle" fill="#888" font-size="11">三个需求（🎁礼物贴纸 · 🎁成组送 · 🔗连线迁移）+ 一个线上问题（📺KMP连麦画面静止）</text>
  <text x="500" y="408" text-anchor="middle" fill="#aaa" font-size="10">覆盖 4.1 需求拆解 → 4.6 线上Bug 七阶段完整流水线</text>
