  <text x="420" y="268" text-anchor="middle" fill="#7A4AAA" font-size="9">业务上下文重</text>
  
  <rect x="350" y="280" width="140" height="35" rx="5" fill="#E0F4F8" stroke="#00838F" stroke-width="1"/>
