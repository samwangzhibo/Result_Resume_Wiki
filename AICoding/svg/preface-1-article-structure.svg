  <text x="540" y="318" fill="#9A4080" font-size="10">7.2 不同角色应对方向</text>

  <!-- 章节8 -->
  <rect x="760" y="260" width="220" height="85" rx="8" fill="white" stroke="#6A1B9A" stroke-width="1.5" filter="url(#s)"/>
  <rect x="760" y="260" width="220" height="28" rx="8" fill="#6A1B9A"/>
  <rect x="760" y="280" width="220" height="8" fill="#6A1B9A"/>
