  <!-- 第一行：章节 1-3 -->
  <!-- 章节1 -->
  <rect x="20" y="65" width="300" height="75" rx="8" fill="white" stroke="#1565C0" stroke-width="1.5" filter="url(#s)"/>
  <rect x="20" y="65" width="300" height="28" rx="8" fill="#1565C0"/>
  <rect x="20" y="85" width="300" height="8" fill="#1565C0"/>
  <text x="170" y="84" text-anchor="middle" fill="white" font-size="12" font-weight="bold">一、AI Coding 的理解</text>
  <text x="40" y="108" fill="#2B5090" font-size="10">1.1 向内看：落地路径</text>
  <text x="40" y="122" fill="#2B5090" font-size="10">1.2 向外看：行业先行者</text>
  <text x="40" y="136" fill="#5A7AAA" font-size="10">1.3 共同趋势</text>

